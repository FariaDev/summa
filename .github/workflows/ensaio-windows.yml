name: Ensaio no Windows

# O autor não tem um Windows: este é o teste mais perto do real que temos. Um
# runner instala a versão indicada, atualiza pela release publicada com o updater
# dela e abre a Mesa. Não substitui uma pessoa usando. Os testes de janela ficam de
# fora porque ainda não rodam no Windows: os motores falsos são scripts `.mjs` (#108).
#
# Dois caminhos (#6): o `ensaio` fecha a Mesa antes de atualizar (CLI, updater da
# tag publicada); o `mesa-aberta` sobe a Mesa, deixa um MCP de ensaio segurando o
# electron.exe e dispara o update pelo mesmo IPC do clique em "Atualizar e
# reiniciar". O caminho aberto usa o código deste PR como partida — nenhuma tag
# publicada tem o updater do #47, e o `update-apply` recusa em `DESK_TEST`.
on:
  workflow_dispatch:
    inputs:
      from:
        description: Versão de partida
        default: v1.3.0
        required: true
      versao:
        description: Versão de destino, para ensaiar uma pre-release antes de marcá-la latest (vazio = a latest)
        default: ''
        required: false

permissions:
  contents: read

jobs:
  ensaio:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      FROM_TAG: ${{ inputs.from }}
      TO_VERSION: ${{ inputs.versao }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'

      - name: Instalar a versão de partida, como quem baixou o zip
        run: |
          curl -fsSL -o antiga.zip "https://codeload.github.com/FariaDev/summa/zip/refs/tags/${FROM_TAG}"
          unzip -q antiga.zip -d instalacao
          DESK="$(cd instalacao/* && pwd -W)/desk"
          echo "DESK=$DESK" >> "$GITHUB_ENV"
          cd "$DESK"
          npm ci --no-audit --no-fund
          echo '{"ensaio":true}' > config.json
          # Quem já abriu a Mesa tem a pasta de dados; o updater grava o lock nela.
          node -e 'require("fs").mkdirSync(require("path").join(process.env.APPDATA,"Mesa de Estudos","runtime"),{recursive:true})'
          grep '"version"' package.json

      - name: Atualizar pelo updater da versão de partida
        run: |
          cd "$DESK"
          # O updater só vê a latest; a pre-release se ensaia pelo --versao dele.
          if [ -n "$TO_VERSION" ]; then
            npm run update -- --versao "${TO_VERSION#v}" --sem-reabrir
            LATEST="${TO_VERSION#v}"
          else
            npm run update -- --sem-reabrir
            LATEST="$(curl -fsSL https://api.github.com/repos/FariaDev/summa/releases/latest | node -p 'JSON.parse(require("fs").readFileSync(0)).tag_name.slice(1)')"
          fi
          INSTALLED="$(node -p 'require("./package.json").version')"
          test "$INSTALLED" = "$LATEST" || { echo "instalada $INSTALLED, publicada $LATEST"; exit 1; }
          grep -q '"ensaio":true' config.json
          node node_modules/electron/install.js

      - name: A atualização seguinte continua aceitando a release assinada
        run: |
          cd "$DESK"
          npm run update -- --sem-reabrir 2>&1 | tee proxima.log
          grep -q 'última versão' proxima.log

      - name: Abrir a Mesa atualizada por 30 s
        shell: pwsh
        run: |
          Set-Location $env:DESK
          $env:LEARNING_DESK_RUNTIME = Join-Path $env:RUNNER_TEMP 'mesa-ensaio'
          $mesa = Start-Process -FilePath 'node_modules\electron\dist\electron.exe' -ArgumentList '.' -PassThru
          Start-Sleep -Seconds 30
          if ($mesa.HasExited) { throw "a Mesa fechou sozinha: código $($mesa.ExitCode)" }
          Stop-Process -Id $mesa.Id -Force
          $log = Join-Path $env:LEARNING_DESK_RUNTIME 'desk.log'
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern '"level":"error"' -Quiet)) { throw 'erro no desk.log' }

  # #6: a pessoa atualiza com a Mesa aberta e o tutor/MCP de pé. O caminho
  # fechado acima não reproduz o EPERM/EBUSY do `npm ci` no Windows.
  mesa-aberta:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      FROM_TAG: ${{ inputs.from }}
      TO_VERSION: ${{ inputs.versao }}
      # A API pública do GitHub responde 403 no IP compartilhado do runner; o
      # driver usa o token só para ler a última release ao escolher o alvo.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Preparar a partida com o updater do PR
        run: |
          set -euo pipefail
          INSTALL="$RUNNER_TEMP/mesa-aberta"
          rm -rf "$INSTALL"
          mkdir -p "$INSTALL"
          cp -R desk "$INSTALL/desk"
          cd "$INSTALL/desk"
          export FROM_VERSION="${FROM_TAG#v}"
          # A tag publicada não tem o updater do #47; a partida é este código com
          # a versão do input para a trava anti-rollback deixar aplicar a release.
          node -e 'const fs=require("fs"); for(const f of ["package.json","package-lock.json"]){const p=JSON.parse(fs.readFileSync(f,"utf8")); p.version=process.env.FROM_VERSION; if(p.packages&&p.packages[""])p.packages[""].version=process.env.FROM_VERSION; fs.writeFileSync(f,JSON.stringify(p,null,2)+"\n");}'
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js
          echo "DESK=$INSTALL/desk" >> "$GITHUB_ENV"
          echo "FROM_VERSION=$FROM_VERSION" >> "$GITHUB_ENV"
          grep '"version"' package.json

      - name: Mesa aberta, MCP de ensaio de pé e clique em Atualizar
        run: |
          cd "$DESK"
          node scripts/update-open-rehearsal.mjs

      - name: Log do update (espera do #47 e resultado)
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:DESK '.runtime-mesa-aberta\desk.log'
          if (Test-Path $log) {
            Get-Content $log | Select-String 'update:' | Select-Object -Last 40
          } else {
            Write-Output "sem desk.log em $log"
          }
