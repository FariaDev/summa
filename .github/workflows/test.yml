name: Testes

# O Summa é público desde 2026-11-12 (#130 do repositório antigo): minuto de
# Actions não conta cota, então PR e push na main rodam Ubuntu, Windows e macOS.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: desk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: desk/package-lock.json

      - name: Dependências do Electron (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2 libxtst6

      - name: npm ci
        run: npm ci

      # O binário do Electron pode não vir no `npm ci` (download sob demanda);
      # baixa agora para os testes não correrem contra o download.
      - name: Binário do Electron
        run: node node_modules/electron/install.js

      - name: Sandbox do Electron (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Identidade do Git para os testes de backup
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@mesa.local"

      - name: Testes de unidade (Linux, sob xvfb)
        if: runner.os == 'Linux'
        env:
          MESA_GATE_CACHE: '0'
        run: xvfb-run -a npm test

      - name: Testes de unidade (macOS e Windows)
        if: runner.os != 'Linux'
        env:
          MESA_GATE_CACHE: '0'
        run: npm test

  # Testes de janela no Windows (#108): os motores falsos sobem por um `.cmd`
  # (`fakeEngineLauncher`). Job separado do `unit` para uma falha de janela não
  # esconder a suíte de unidade. Proposta em docs/design/108-windows-ui.md §4.
  # Roda em todo PR desde que o repositório ficou público (#130 do antigo).
  ui-windows:
    # Quatro fatias em paralelo: a rodada inteira levava 25-30 min (run
    # 43463828136, 30m46s só no passo do resto) enquanto os outros jobs fechavam
    # em 4 min. O corredor divide a lista filtrada com `--shard I/4` (#165).
    name: janelas (windows-latest, fatia ${{ matrix.shard }}/4)
    runs-on: windows-latest
    # 3 por vez no runner Windows estourava o fechamento e o prazo de 600 s:
    # run 43110682784, 135 ok e 38 falhas (17 "não fechou em 15 s" e quatro
    # arquivos nos 600 s) em 2659 s. Dois por vez dá CPU a cada Electron. Os
    # quatro arquivos de motores falsos com portão sobem um por vez, em passo
    # próprio: juntos eles ficavam 600 s presos mesmo com 2 por vez (#165).
    # 30 min é o antigo 120 dividido por 4, com folga para a fatia 1 somar os
    # pesados; fail-fast false para uma fatia não cancelar as outras.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: desk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: desk/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Binário do Electron
        run: node node_modules/electron/install.js

      - name: Identidade do Git para os testes de backup
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@mesa.local"

      # Motores falsos com portão que sobem vários apps no mesmo arquivo: um por
      # vez e sozinhos para não disputar o runner com outro Electron (#165).
      # Só na fatia 1, fora do rateio das demais.
      - name: Janelas de motores pesados (um por vez)
        if: matrix.shard == 1
        run: npm run ui -- i18n-en-leaks,pi-opcional,stream-motion,switch-engine --jobs 1

      - name: Testes de janela (fatia ${{ matrix.shard }}/4)
        run: npm run ui -- --jobs 2 --exclude i18n-en-leaks,pi-opcional,stream-motion,switch-engine --shard ${{ matrix.shard }}/4

      # `withArtifacts` grava a falha em `desk/tests/artifacts/<data>-<nome>`
      # (runtime, desk.json e screenshot), mas o corredor não subia a pasta: a
      # falha intermitente do Windows chegava sem captura (#1). Roda depois de
      # qualquer passo que falhe, inclusive o dos motores pesados.
      - name: Capturas da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ runner.os }}-fatia-${{ matrix.shard }}
          path: desk/tests/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  bend:
    name: bend (toolchain fixada)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Cache da toolchain do Bend
        id: toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.bend
            ~/.bun
          key: bend-${{ runner.os }}-${{ hashFiles('core/toolchain.json') }}

      - name: Instala bun e bend fixados
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BUN_VERSION="$(node -p "require('./core/toolchain.json').bun")"
          BEND_COMMIT="$(node -p "require('./core/toolchain.json').bend.source.match(/@([0-9a-f]+)/)[1]")"
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          git clone --quiet https://github.com/bendlang/bend /tmp/bend
          git -C /tmp/bend checkout --quiet "$BEND_COMMIT"
          mkdir -p "$HOME/.bend/versions/$BEND_COMMIT"
          cp -R /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/versions/$BEND_COMMIT/"
          ln -sfn "$HOME/.bend/versions/$BEND_COMMIT" "$HOME/.bend/current"
          mkdir -p "$HOME/.bend/bin"
          printf '#!/bin/sh\nexec "${BUN_BIN:-$HOME/.bun/bin/bun}" "$HOME/.bend/current/bend2/main.ts" "$@"\n' > "$HOME/.bend/bin/bend"
          chmod +x "$HOME/.bend/bin/bend"

      - name: Confere a toolchain fixada
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.bend/bin:$HOME/.bun/bin:$PATH"
          bend version
          bun --version

      - name: npm ci
        working-directory: desk
        run: npm ci

      - name: Portão estrito do núcleo
        working-directory: desk
        shell: bash
        env:
          MESA_REQUIRE_BEND: '1'
        run: |
          set -euo pipefail
          export PATH="$HOME/.bend/bin:$HOME/.bun/bin:$PATH"
          npm run verify:bend
