<style>
body{margin:0;font-family:var(--font-ui);color:#161616}
main{padding:24px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lock{display:flex;align-items:center;gap:.28em;padding:28px 24px;border-radius:8px;font-size:44px;line-height:1}
.lock svg{height:1.15em;width:.75em;flex:none}
.l{background:#fff;color:#161616;border:1px solid #e0e0e0}
.d{background:#161616;color:#fff}
.v{background:#fff;color:#161616;border:1px solid #e0e0e0}.v svg{color:#8044ca}
.serif{font-family:var(--font-serif)}
.sans{font-family:var(--font-ui);font-weight:500;letter-spacing:-.01em}
.long{gap:0}.long svg{height:1.3em;width:.84em;margin-right:-.06em;transform:translateY(.1em)}
.cap{grid-column:1/-1;font-size:12px;color:#525252;margin:12px 0 0;font-weight:600}
</style>

<script>
const s='<svg><use href="#int" width="100%" height="100%"/></svg>';
const L=(cls,font,word)=>`<div class="lock ${cls} ${font}">${s}<span>${word}</span></div>`;
const rows=[
  ['STIX','serif','l'],['STIX, escuro','serif','d'],
  ['Plex','sans','l'],['Plex, escuro','sans','d'],
  ['STIX, violeta','serif','v'],
];
let h='';
for(const [cap,f,c] of rows){h+=`<p class="cap">${cap}</p>`+L(c,f,'Summa')+L(c,f,'Mesa');}
// A integral no lugar do S: ela é o s longo de "summa" (Leibniz, 1675).
h+='<p class="cap">A integral no lugar do S</p>'+`<div class="lock l serif long">${s}<span>umma</span></div><div class="lock d serif long">${s}<span>umma</span></div>`;
document.getElementById('m').innerHTML=h;
</script>
