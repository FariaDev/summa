<title>Summa: divulgação r1</title>
<link rel="stylesheet" href="../carbon-r2/tokens.css">
<style>
body{margin:0;font-family:var(--font-ui);color:#161616}
main{padding:24px 16px;display:flex;flex-direction:column;gap:12px}
.cap{font-size:12px;font-weight:600;color:#525252;margin:16px 0 0}
.fit{width:100%;max-width:1280px}
/* prancheta no tamanho real (1280×640), reduzida com zoom para caber na tela */
.board{width:1280px;height:640px;position:relative;overflow:hidden;box-sizing:border-box}
.claro{background:#fff;color:#161616;outline:1px solid #e0e0e0}
.escuro{background:#161616;color:#f4f4f4}
.lock{display:flex;align-items:center;gap:28px;font-family:var(--font-serif);line-height:1}
.lock svg{flex:none}
.line{font-family:var(--font-ui);font-size:30px;line-height:40px;margin:0;text-wrap:balance}
.claro .line{color:#525252}.escuro .line{color:#c6c6c6}
/* A: centrado */
.a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;text-align:center}
.a .lock{font-size:150px}
/* lema (2026-11-11): "resolve-se andando", Diógenes; a linha de baixo diz o que o app é */
/* C e D (2026-11-11): o lema "Solvitur ambulando" (resolve-se andando, Diógenes) no lugar da frase */
.motto{font-family:var(--font-serif);font-style:italic;font-size:48px;line-height:56px;margin:0}
.b .motto{font-size:44px;line-height:52px}
.claro .motto{color:#525252}.escuro .motto{color:#c6c6c6}
.a .lock svg{width:110px;height:170px}
/* B: marca à esquerda, o app sangrando à direita */
.b .side{position:absolute;left:88px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center;gap:32px}
.b .lock{font-size:112px;gap:20px}.b .lock svg{width:82px;height:126px}
/* recorte da direita da tela: formulário e tutor, que é o que a Summa tem de diferente */
.b .shot{position:absolute;left:600px;top:96px;width:760px;height:600px;overflow:hidden;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.b .shot img{display:block;width:1180px;margin-left:-420px}
.escuro.b .shot{box-shadow:0 0 0 1px #393939}
</style>
</head>

<main id="m"></main>
<script>
const MOTTO='<p class="motto">Solvitur ambulando.</p>';
const LINE='Estude com seus PDFs e um tutor que não dá a resposta antes de você.';
const lock='<div class="lock"><svg><use href="#int" width="100%" height="100%"/></svg><span>Summa</span></div>';
const side=(text,theme)=>`<div class="side">${lock}${text}</div><div class="shot"><img src="img/app-${theme}.png" alt=""></div>`;
const line=`<p class="line">${LINE}</p>`;
const LINE_EN='Study with your PDFs and a tutor that won’t give you the answer before you do.';
const boards=[];
for(const t of ['claro','escuro']){
  boards.push([`A · ${t}`,`a ${t}`,lock+line],[`B · ${t}`,`b ${t}`,side(line,t)],
              [`C · ${t}`,`a ${t}`,lock+MOTTO],[`D · ${t}`,`b ${t}`,side(MOTTO,t)],
              [`A EN · ${t}`,`a ${t}`,lock+`<p class="line">${LINE_EN}</p>`]);
}
// ?board=A-escuro mostra só essa prancheta, em 1280×640 sem moldura, para exportar o PNG
const only=new URLSearchParams(location.search).get('board');
if(only){
  const hit=boards.find(([c])=>c.replace(' · ','-').replace(' ','-')===only);
  document.body.style.margin='0';
  document.getElementById('m').outerHTML=`<div class="board ${hit[1]}" style="outline:0">${hit[2]}</div>`;
} else document.getElementById('m').innerHTML=boards.map(([c,k,h])=>`<p class="cap">${c}</p><div class="fit"><div class="board ${k}">${h}</div></div>`).join('');
if(!only){const fit=()=>document.querySelectorAll('.fit').forEach(f=>{f.firstElementChild.style.zoom=f.clientWidth/1280;});
fit();addEventListener('resize',fit);}
</script>
