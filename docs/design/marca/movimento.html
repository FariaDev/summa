<!doctype html>
<html lang="pt-BR" data-theme="light" data-accent="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marca: "pensando" e primeira abertura sem a luminária</title>
<link rel="stylesheet" href="../carbon-r2/tokens.css">
<style>
/* Opções para substituir a luminária no "pensando" do chat e na primeira
   abertura (2026-11-11). Integral: o mesmo path de r1.html. */
:root{--ink:#161616}
:root[data-theme="dark"]{--ink:#f4f4f4}
:root[data-accent="violet"]{--ink:#8044ca}
:root[data-theme="dark"][data-accent="violet"]{--ink:#b89cea}
body{margin:0;font-family:var(--font-ui);font-size:14px;line-height:20px}
.board{background:var(--bg);color:var(--text);border-radius:8px;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--border-subtle);border-radius:4px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:4px 10px;font-size:12px;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--layer-hover);color:var(--text)}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--text-2);cursor:pointer}
h2{font-size:16px;font-weight:600;margin:24px 0 12px}
h2:first-of-type{margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid:has(> :only-child){max-width:520px}
.card{border:1px solid var(--border-subtle);border-radius:4px;padding:12px;background:var(--layer-1)}
.card h3{font-size:14px;font-weight:600;margin:0 0 8px}
.card h3 small{font-weight:400;color:var(--text-3);margin-left:6px}
svg{display:block}

/* "pensando": o chat em miniatura */
.chat{background:var(--bg);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.msg{align-self:flex-end;background:var(--layer-1);border-radius:8px;padding:6px 10px;font-size:13px;max-width:80%}
.think{display:flex;align-items:center;gap:8px;height:22px;color:var(--text-3);font-size:13px}
.big{display:flex;justify-content:center;padding:8px 0 0}
.glyph{overflow:visible}
.glyph .base{fill:var(--ink)}
.glyph .faint{fill:var(--ink);opacity:.18}

/* A: a integral se desenha */
.draw .spine{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2s var(--ease-out,cubic-bezier(.2,0,.38,.9)) infinite}
@keyframes draw{0%{stroke-dashoffset:1;opacity:1}60%{stroke-dashoffset:0;opacity:1}85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
/* C: um trecho de tinta corre pela integral */
.drop .spine{stroke-dasharray:.16 .84;stroke-dashoffset:.16;animation:drop 1.6s linear infinite}
@keyframes drop{to{stroke-dashoffset:-.84}}
/* E: desenha e apaga, sem sumir */
.erase .spine{stroke-dasharray:1 1;stroke-dashoffset:1;animation:erase 2.4s cubic-bezier(.4,0,.2,1) infinite}
@keyframes erase{0%{stroke-dashoffset:1}45%,55%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
/* G: três integrais como os pontinhos de digitação */
.trio-dots{display:inline-flex;gap:2px}
.trio-dots svg{animation:hop 1.2s ease-in-out infinite}
.trio-dots svg:nth-child(2){animation-delay:.15s}.trio-dots svg:nth-child(3){animation-delay:.3s}
@keyframes hop{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-2px)}}
.reduced .erase .spine{animation:none;stroke-dasharray:none;stroke-dashoffset:0}
.reduced .trio-dots svg{animation:none;opacity:.6}
/* J: um ciclo só: a integral se desenha e, quando termina, o brilho corre pelo texto */
.drawsync .spine{stroke-dasharray:1;stroke-dashoffset:1;animation:drawsync 2.6s cubic-bezier(.2,0,.38,.9) infinite}
@keyframes drawsync{0%{stroke-dashoffset:1;opacity:1}40%{stroke-dashoffset:0;opacity:1}88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.shine.sync{animation:shinesync 2.6s linear infinite}
@keyframes shinesync{0%,40%{background-position:100% 0}88%,100%{background-position:0 0}}
/* K: um brilho só atravessa a integral e o texto, como uma peça */
.rowshine{display:inline-flex;align-items:center;gap:8px;color:var(--text);-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.3) 0 40%,#000 50%,rgba(0,0,0,.3) 60% 100%);mask-image:linear-gradient(90deg,rgba(0,0,0,.3) 0 40%,#000 50%,rgba(0,0,0,.3) 60% 100%);-webkit-mask-size:300% 100%;mask-size:300% 100%;animation:maskshine 1.8s linear infinite}
@keyframes maskshine{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
.reduced .drawsync .spine{animation:none;stroke-dasharray:none;stroke-dashoffset:0}
.reduced .shine.sync{animation:breathe 2s ease-in-out infinite}
.reduced .rowshine{animation:breathe 2s ease-in-out infinite;-webkit-mask-image:none;mask-image:none;color:var(--text-3)}
/* B: texto com brilho */
.shine{background:linear-gradient(90deg,var(--text-3) 0 35%,var(--text) 50%,var(--text-3) 65% 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.8s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
/* movimento reduzido: tudo parado, só a opacidade respira */
.reduced .draw .spine,.reduced .drop .spine{animation:none;stroke-dasharray:none;stroke-dashoffset:0}
.reduced .glyph,.reduced .shine{animation:breathe 2s ease-in-out infinite}
.reduced .shine{background:none;color:var(--text-3)}
@keyframes breathe{50%{opacity:.4}}

/* primeira abertura */
.stepper{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
.stepper button{all:unset;cursor:pointer;border:1px solid var(--border-subtle);border-radius:4px;padding:2px 8px}
.scene{background:var(--bg);border-radius:4px;padding:10px}
.cap{font-family:var(--font-serif);font-size:16px;line-height:22px;text-align:center;margin:10px 0 2px;min-height:22px}
.mini .win{fill:var(--layer-1);stroke:var(--border-subtle)}
.mini .bar0{fill:var(--layer-hover)}
.mini .page{fill:#fff;stroke:var(--border-subtle)}
.mini .line{stroke:#c6c6c6;stroke-width:2;stroke-linecap:round}
.mini .bub{fill:var(--layer-2)}
.mini .bub.me{fill:var(--layer-hover)}
.mini .hand{fill:none;stroke:var(--text-2);stroke-width:1.6;stroke-linecap:round}
.mini .tab{fill:var(--layer-2)}
.mini .tabt{font:9px var(--font-ui);fill:var(--text)}
.mini .region{transition:opacity .35s}
.mini.focus .region{opacity:.3}
.mini.focus .region.on{opacity:1}
.mini .ring{fill:none;stroke:var(--ink);stroke-width:2;rx:6;transition:all .4s cubic-bezier(.2,0,.38,.9)}
.mini .brush{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.mini .brush.go{animation:brush .7s cubic-bezier(.2,0,.38,.9) both}
@keyframes brush{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.reduced .mini .brush.go{animation:none}
.drawonce .spine{stroke-dasharray:1;stroke-dashoffset:1;animation:once 1.4s cubic-bezier(.2,0,.38,.9) .2s forwards}
@keyframes once{to{stroke-dashoffset:0}}
.reduced .drawonce .spine{animation:none;stroke-dasharray:none;stroke-dashoffset:0}
.layer{transition:opacity .5s}
/* Boas-vindas → passeio: a integral encolhe rumo à aba e a Mesa entra depois,
   para a troca não ser um corte seco. */
.layer.brand{transform-origin:260px 140px;transition:opacity .6s ease .15s,transform .9s cubic-bezier(.2,0,.38,.9)}
.layer.brand.leaving{transform:translate(-215px,-126px) scale(.08)}
.layer.app{transition:opacity .8s ease .35s}
.caret{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.reduced .layer.brand,.reduced .layer.app{transition:none}
.reduced .caret{animation:none}
.inkfill{fill:var(--ink);opacity:.16;transform-box:fill-box;transform-origin:50% 100%}
.inkfill.go{animation:rise .8s cubic-bezier(.2,0,.38,.9) both}
@keyframes rise{from{transform:scaleY(0)}to{transform:none}}
.reduced .inkfill.go{animation:none}
.riemann rect{fill:var(--ink);opacity:.22;transition:opacity .4s}
.riemann rect.off{opacity:0}
.reduced .layer,.reduced .riemann rect{transition:none}
.reduced .mini .ring,.reduced .area-clip{transition:none}
.area{fill:var(--ink);opacity:.22}
.curve{fill:none;stroke:var(--ink);stroke-width:2}
.axis{stroke:var(--border-strong);stroke-width:1}
.area-clip{transition:width .6s cubic-bezier(.2,0,.38,.9)}
</style>
</head>
<body>

  <div class="bar">
    <span class="seg" data-key="theme"><button data-v="light">Claro</button><button data-v="dark">Escuro</button></span>

function curveArea(w,h,pad){
  const f=t=>h-pad-(h-2*pad)*(.35+.45*Math.sin(t*Math.PI*.9+.3)*(1-.25*t));
  const pts=Array.from({length:41},(_,i)=>[pad+i*(w-2*pad)/40,f(i/40)]);
  const top=pts.map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join(' L');
  return {curve:`M${top}`,area:`M${pad},${h-pad} L${top} L${w-pad},${h-pad}Z`,x0:pad,x1:w-pad};
}
const RECT_N=8;
function riemann(w,h,pad){
  const c=curveArea(w,h,pad);const step=(c.x1-c.x0)/RECT_N;
  const f=t=>h-pad-(h-2*pad)*(.35+.45*Math.sin(t*Math.PI*.9+.3)*(1-.25*t));
  return Array.from({length:RECT_N},(_,i)=>{const y=f((i+.5)/RECT_N);return `<rect data-i="${i}" x="${(c.x0+i*step+1).toFixed(1)}" y="${y.toFixed(1)}" width="${(step-2).toFixed(1)}" height="${(h-pad-y).toFixed(1)}"/>`;}).join('');
}
const OPTIONS=[
  ['A','Área sob a curva como progresso','sua escolha',()=>{const c=curveArea(520,300,24);return `<svg viewBox="0 0 520 300" width="100%">
${glyph(150,'still').replace('<svg','<svg x="14" y="70"')}
<g transform="translate(150,0) scale(.71,1)"><defs><clipPath id="clipA"><rect class="area-clip" x="${c.x0}" y="0" width="0" height="300"/></clipPath></defs>
<line class="axis" x1="${c.x0}" y1="276" x2="${c.x1}" y2="276"/><path class="area" d="${c.area}" clip-path="url(#clipA)"/><path class="curve" d="${c.curve}" vector-effect="non-scaling-stroke"/></g></svg>`;}],
  ['B','A Mesa em miniatura','sua escolha (base)',()=>`<svg class="mini focus" viewBox="0 0 520 300" width="100%">${mesaMini()}<rect class="ring" x="0" y="0" width="0" height="0"/></svg>`],
  ['D','Soma de Riemann: cada passo é um retângulo','nova',()=>{const c=curveArea(520,300,24);return `<svg viewBox="0 0 520 300" width="100%">
${glyph(150,'still').replace('<svg','<svg x="14" y="70"')}
<g transform="translate(150,0) scale(.71,1)"><line class="axis" x1="${c.x0}" y1="276" x2="${c.x1}" y2="276"/><g class="riemann">${riemann(520,300,24)}</g>
<path class="area full" d="${c.area}" style="transition:opacity .5s"/><path class="curve" d="${c.curve}" vector-effect="non-scaling-stroke"/></g></svg>`;}],
  ['E','Miniatura: a região enche de tinta','nova',()=>`<svg class="mini" viewBox="0 0 520 300" width="100%">${mesaMini()}<rect class="inkfill" x="0" y="300" width="0" height="0" rx="6"/></svg>`],
  ['F','A integral se desenha e abre a Mesa','do final você gostou',()=>`<svg class="mini focus" viewBox="0 0 520 300" width="100%"><g class="layer app">${mesaMini()}<rect class="ring" x="0" y="0" width="0" height="0"/></g><g class="layer brand"></g></svg>`],
  ['H','Miniatura, e a integral fecha no Pronto','nova',()=>`<svg class="mini focus" viewBox="0 0 520 300" width="100%"><g class="layer app">${mesaMini()}<rect class="ring" x="0" y="0" width="0" height="0"/></g><g class="layer brand"></g></svg>`],
  ['I','Miniatura, com a integral abrindo e fechando','escolhida',()=>`<svg class="mini focus" viewBox="0 0 520 300" width="100%"><g class="layer app">${mesaMini()}<rect class="ring" x="0" y="0" width="0" height="0"/></g><g class="layer brand"></g></svg>`],
  ['G','A área sob a curva revela a Mesa','nova',()=>{const c=curveArea(520,300,0);const top=c.curve.replace(/(\d+\.\d),(\d+\.\d)/g,(m,x,y)=>`${x},${(+y*.25).toFixed(1)}`);return `<svg class="mini" viewBox="0 0 520 300" width="100%">
<defs><clipPath id="clipG1"><path d="${top} L520,300 L0,300Z"/></clipPath><clipPath id="clipG2"><rect class="area-clip" x="0" y="0" width="0" height="300"/></clipPath></defs>
<g opacity=".12">${mesaMini()}</g><g clip-path="url(#clipG2)"><g clip-path="url(#clipG1)">${mesaMini()}</g><path class="curve" d="${top}"/></g></svg>`;}],
];
const setup=document.getElementById('setup');
setup.innerHTML=OPTIONS.filter(([k])=>ALL||PICK_S.includes(k)).map(([k,t,note,scene])=>`<div class="card" data-opt="${k}"><h3>${k}. ${t}${note?`<small>${note}</small>`:''}</h3><div class="scene">${scene()}<p class="cap"></p></div></div>`).join('');

/* Nome: "Cálculo I" digitado letra a letra, com o cursor piscando. */
const NAME='Cálculo I';
function typeName(el,at){
  clearInterval(el.timer);
  el.style.fill=at<5?'var(--text-3)':'';
  if(at!==5){el.textContent=at<5?'Nova matéria':NAME;return;}
  const caret='<tspan class="caret">|</tspan>';
  if(document.getElementById('board').classList.contains('reduced')){el.innerHTML=NAME+caret;return;}
  let n=0;el.innerHTML=caret;
  el.timer=setInterval(()=>{n++;el.innerHTML=NAME.slice(0,n)+caret;if(n>=NAME.length)clearInterval(el.timer);},120);
}
let step=+(new URLSearchParams(location.search).get('step')||0);
function render(){
  const [name,region,cap]=STEPS[step];
  document.getElementById('stepname').textContent=`${step+1}/${STEPS.length} · ${name}`;
  const frac=step/(STEPS.length-1);
  for(const card of setup.children){
    card.querySelector('.cap').textContent=cap;
    const full={A:520-48,G:520}[card.dataset.opt]||520-8;
    for(const clip of card.querySelectorAll('.area-clip'))clip.setAttribute('width',(full*frac).toFixed(1));
    for(const r of card.querySelectorAll('.riemann rect'))r.classList.toggle('off',+r.dataset.i>=step||step===STEPS.length-1);
    const smoothArea=card.querySelector('.area.full');if(smoothArea)smoothArea.style.opacity=step===STEPS.length-1?.22:0;
    const ink=card.querySelector('.inkfill');
    if(ink){const b=region?BOX[region]:[0,0,0,0];ink.classList.remove('go');ink.setAttribute('x',b[0]);ink.setAttribute('y',b[1]);ink.setAttribute('width',b[2]);ink.setAttribute('height',b[3]);void ink.getBBox();ink.classList.add('go');}
    const brand=card.querySelector('.layer.brand');
    if(brand){const app=card.querySelector('.layer.app');const last=STEPS.length-1;
      const at={F:[0],H:[last],I:[0,last]}[card.dataset.opt]||[];const show=at.includes(step);
      clearTimeout(brand.timer);
      if(show&&brand.dataset.on!==String(step)){brand.classList.remove('leaving');brand.innerHTML=glyph(170,'drawonce').replace('<svg','<svg x="175" y="55"');brand.dataset.on=String(step);}
      if(!show&&brand.dataset.on){const fromWelcome=brand.dataset.on==='0'&&step===1;delete brand.dataset.on;
        if(fromWelcome){brand.classList.add('leaving');brand.timer=setTimeout(()=>{brand.innerHTML='';brand.classList.remove('leaving');},1000);}else brand.innerHTML='';}
      brand.style.opacity=show?1:0;app.style.opacity=!show?1:step===last?.15:0;}
    const mini=card.querySelector('.mini');if(!mini)continue;
    mini.classList.toggle('focus',['B','F','H','I'].includes(card.dataset.opt)&&!!region&&region!=='all');
    for(const g of mini.querySelectorAll('.region'))g.classList.toggle('on',region===g.dataset.r);
    for(const name of mini.querySelectorAll('[data-name]'))typeName(name,step);
    const ring=mini.querySelector('.ring');
    if(ring){const show=region&&region!=='all';const b=ringFor(region||'all');ring.setAttribute('x',b.x);ring.setAttribute('y',b.y);ring.setAttribute('width',b.w);ring.setAttribute('height',b.h);ring.style.opacity=show?1:0;}
    const brush=mini.querySelector('.brush');
    if(brush){brush.classList.remove('go');if(region){brush.setAttribute('d',brushAround(region));void brush.getBBox();brush.classList.add('go');brush.style.opacity=1;}else brush.style.opacity=0;}
  }
}
document.getElementById('prev').onclick=()=>{step=(step+STEPS.length-1)%STEPS.length;render();};
document.getElementById('next').onclick=()=>{step=(step+1)%STEPS.length;render();};
/* Boas-vindas e Pronto ficam mais tempo, para a integral terminar de se desenhar. */
function stepTime(at){return at===0||at===STEPS.length-1?3800:at===5?3200:2600;}
(function tick(){setTimeout(()=>{if(document.getElementById('auto').checked){step=(step+1)%STEPS.length;render();}tick();},stepTime(step));})();

const root=document.documentElement;
for(const seg of document.querySelectorAll('.seg')){
  const key=seg.dataset.key;
  const sync=()=>{for(const b of seg.children)b.setAttribute('aria-pressed',String(root.dataset[key]===b.dataset.v));};
  seg.onclick=e=>{const b=e.target.closest('button');if(!b)return;root.dataset[key]=b.dataset.v;sync();};
  sync();
}
document.getElementById('reduced').onchange=e=>{document.getElementById('board').classList.toggle('reduced',e.target.checked);for(const s of document.querySelectorAll('svg.glyph'))e.target.checked?s.pauseAnimations():s.unpauseAnimations();};
render();
</script>
</body>
