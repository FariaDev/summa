body{margin:0;font:14px/1.45 system-ui,sans-serif;color:#d8d8d8}
h2{font-size:15px;margin:22px 0 2px;color:#eee}
p{margin:0 0 10px;color:#a8a8a8;font-size:13px;max-width:680px}
.accents{display:flex;gap:10px;flex-wrap:wrap}

.desk.light{background:linear-gradient(135deg,#c8d4e6,#e6d8e8 60%,#f0dccd)}
.dock{display:flex;gap:6px;padding:6px 10px;border-radius:18px;background:#ffffff26;border:1px solid #ffffff30}
.dock svg{width:48px;height:48px;display:block}
.opt{padding:6px 0 18px;border-bottom:1px solid #8883}

<script>
// Acentos aprovados (DECISOES.md): o ícone segue o acento, como o app já faz.
const ACC=[['Azul','#2d5fdc','#fff'],['Violeta','#8044ca','#fff'],['Verde','#028053','#fff'],['Laranja','#af4700','#fff'],['Rosa','#bd1c67','#fff'],['Grafite','#303030','#fff']];
const V=[
 ['A','A · π-mesa','A mesa desenhada como π: o tampo passa das pernas e a perna direita tem o pé do π. De longe é π (matemática); olhando, é uma mesa (o nome do app).'],
 ['B','B · π serifado','O π da STIX Two, a mesma fonte dos títulos e da matemática no app. Mais clássico e editorial que o A; a identidade vem do contraste com a Plex da interface.'],
 ['C','C · Planalto','"Mesa" também é o morro de topo plano. Forma abstrata e calma, foge do óbvio; a ligação com estudo é só o nome.'],
];
const st=(a)=>`--acc:${a[1]};--ink:${a[2]}`;
const sym=(id,px,a)=>{const s=px<=32;return `<svg width="${px}" height="${px}" viewBox="0 0 ${s?16:1024} ${s?16:1024}" style="${st(a)}"><use href="#${s?id+'16':id}"/></svg>`};
const n=k=>`<svg viewBox="0 0 1024 1024"><use href="#${k}"/></svg>`;
let h='';
for(const [id,name,note] of V){
