<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Logo — estilos</title>
<style>
body{margin:0;font:14px/1.45 system-ui,sans-serif;color:#d8d8d8}
h2{font-size:15px;margin:20px 0 2px;color:#eee}
p{margin:0 0 8px;color:#a8a8a8;font-size:13px;max-width:690px}
.row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.row figure{margin:0;text-align:center;font:11px system-ui;color:#999}
.big{width:150px;height:150px;display:block}
.mid{width:64px;height:64px;display:block}
.desk{padding:10px;border-radius:12px;background:linear-gradient(135deg,#2b3a55,#4a3b5c 60%,#6b4e4a)}
.dock{display:flex;gap:6px;padding:6px 10px;border-radius:18px;background:#ffffff26;border:1px solid #ffffff30}
.dock svg{width:48px;height:48px;display:block}
.opt{padding:4px 0 16px;border-bottom:1px solid #8883}
</style></head><body>
<p style="margin-top:6px">O desenho é o mesmo nos quatro (o π-mesa, só como amostra). Julgue só o <b>estilo</b>; o desenho escolhemos depois, dentro do estilo que você gostar.</p>
<div id="out"></div>
<script>
let K=0;
const PI=`<rect x="250" y="330" width="524" height="92" rx="14"/><path d="M372 422h88l-14 316a20 20 0 0 1-20 19h-36a20 20 0 0 1-20-19z"/><path d="M576 422h88v250c0 30 18 44 44 44h28v42h-60c-62 0-100-36-100-98z"/>`;
const mix=(c,p,w)=>`color-mix(in oklch,${c} ${p}%,${w})`;
const PLATE=`<rect x="100" y="100" width="824" height="824" rx="185"`;
function icon(style,acc,cls=''){
 const k='k'+(K++);const id=n=>`${n}${k}`;
 const common=`<filter id="${id('sh')}" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  <filter id="${id('gs')}" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="${mix(acc,60,'#000')}" flood-opacity=".55"/></filter>
  <clipPath id="${id('pl')}">${PLATE}/></clipPath>
  <linearGradient id="${id('v')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(acc,72,'#fff')}"/><stop offset="1" stop-color="${mix(acc,85,'#000')}"/></linearGradient>
  <linearGradient id="${id('w')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dfe3ea"/></linearGradient>
  <linearGradient id="${id('g')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".55" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity=".22"/></linearGradient>
  <radialGradient id="${id('glow')}" cx=".28" cy=".12" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="${id('p')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf9f4"/><stop offset="1" stop-color="#ece6d9"/></linearGradient>
  <filter id="${id('blur')}"><feGaussianBlur stdDeviation="40"/></filter>`;
 const plate=f=>`<g filter="url(#${id('sh')})">${PLATE} fill="${f}"/></g>`;
 const body={
  s1:()=>`${plate(acc)}<g fill="#fff">${PI}</g>`,
  s2:()=>`${plate(`url(#${id('v')})`)}${PLATE} fill="url(#${id('glow')})"/><rect x="104" y="104" width="816" height="816" rx="181" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="6"/>
     <g filter="url(#${id('gs')})" fill="url(#${id('w')})">${PI}</g><rect x="262" y="336" width="500" height="8" rx="4" fill="#fff"/>`,
  s3:()=>`${plate(`url(#${id('v')})`)}<g clip-path="url(#${id('pl')})" filter="url(#${id('blur')})"><circle cx="300" cy="250" r="260" fill="${mix(acc,40,'#fff')}" opacity=".8"/><circle cx="800" cy="880" r="280" fill="${mix(acc,60,'#000')}" opacity=".8"/></g>
     ${PLATE} fill="url(#${id('glow')})"/><g fill="url(#${id('g')})" stroke="#fff" stroke-opacity=".9" stroke-width="6">${PI}</g>`,
  s4:()=>`${plate(`url(#${id('p')})`)}<g clip-path="url(#${id('pl')})"><path d="M100 270H924M100 370H924M100 470H924M100 570H924M100 670H924M100 770H924M100 870H924" stroke="#9db4d8" stroke-opacity=".5" stroke-width="4"/><path d="M226 100V924" stroke="#e08a8a" stroke-opacity=".6" stroke-width="5"/></g>
     <g fill="none" stroke="${acc}" stroke-linecap="round" stroke-linejoin="round"><path d="M262 384C380 366 560 362 772 374" stroke-width="66"/><path d="M420 390C416 500 406 620 382 742" stroke-width="62"/><path d="M612 388C606 500 600 600 616 690C628 744 684 752 746 726" stroke-width="62"/></g>`,
  s5:()=>`${plate(mix(acc,78,'#000'))}<g clip-path="url(#${id('pl')})"><g filter="url(#${id('gs')})"><path d="M100 300C300 240 620 220 924 290V924H100z" fill="${acc}"/></g><g filter="url(#${id('gs')})"><path d="M100 580C340 520 640 540 924 600V924H100z" fill="${mix(acc,75,'#fff')}"/></g></g>
     <g filter="url(#${id('gs')})" fill="#fdfcf8">${PI}</g>`,
 }[style]();
 return `<svg class="${cls}" viewBox="0 0 1024 1024"><defs>${common}</defs>${body}</svg>`;
}
const S=[['s1','1 · Chapado (o estilo das rodadas até aqui)','Forma branca lisa em placa de cor. É o estilo da maioria dos apps web; por isso tudo saiu com cara de "qualquer app".'],
 ['s2','2 · Objeto','A peça tem volume, luz vindo de cima e sombra na cor da placa, como os ícones nativos do macOS. Mais "app de verdade", menos web.'],
 ['s3','3 · Vidro','Peça translúcida sobre a cor, com reflexo; a linha dos ícones novos do macOS. Moderno, mas é moda e pode envelhecer.'],
 ['s4','4 · Tinta no papel','Papel de caderno (pauta e margem) e o desenho a pincel na cor de acento. É o que mais diz "estudo à mão" e o mais pessoal; o acento muda a tinta, não o fundo.'],
 ['s5','5 · Papel recortado','Camadas da cor de acento com sombra entre elas e a peça por cima. Artesanal e quente, com mais detalhe.']];
const ACC=[['Azul','#2d5fdc'],['Verde','#028053'],['Laranja','#af4700'],['Grafite','#303030']];
const nb=(bg,inner)=>`<svg viewBox="0 0 1024 1024"><rect x="100" y="100" width="824" height="824" rx="185" fill="${bg}"/>${inner}</svg>`;
const N=[nb('#f5f5f2','<circle cx="512" cy="512" r="230" fill="#e2483d"/>'),nb('#1f8a5b','<rect x="300" y="300" width="424" height="424" rx="60" fill="#fff"/>'),nb('#262626','<path d="M330 690L512 330L694 690Z" fill="#f2b632"/>')];
document.getElementById('out').innerHTML=S.map(([st,name,note])=>`<div class="opt"><h2>${name}</h2><p>${note}</p><div class="row">
 <figure>${icon(st,ACC[0][1],'big')}Azul</figure>${ACC.slice(1).map(a=>`<figure>${icon(st,a[1],'mid')}${a[0]}</figure>`).join('')}
 <div class="desk"><div class="dock">${N[0]}${N[1]}${icon(st,ACC[0][1])}${N[2]}</div></div></div></div>`).join('');
</script></body></html>
