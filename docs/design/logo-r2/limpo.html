<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Logo — integral</title>
<style>
body{margin:0;font:14px/1.45 system-ui,sans-serif;color:#d8d8d8}
p{margin:6px 0 10px;color:#a8a8a8;font-size:13px;max-width:700px}
table{border-collapse:collapse}
th{font:600 12px system-ui;color:#bbb;text-align:center;padding:4px 6px}
th.l{text-align:left;width:170px}
td{padding:6px;vertical-align:middle;text-align:center}
td.l{text-align:left;font-size:12px;color:#aaa;line-height:1.35}
td.l b{display:block;color:#eee;font-size:13px}
tr{border-bottom:1px solid #8882}
.ic{width:92px;height:92px;display:block;margin:auto}.s32{width:32px;height:32px}.s16{width:16px;height:16px}
.dock{display:inline-flex;gap:5px;padding:5px 8px;border-radius:16px;background:#ffffff26;border:1px solid #ffffff30}
.dock svg{width:40px;height:40px;display:block}
.desk{display:inline-block;padding:8px;border-radius:10px;background:linear-gradient(135deg,#2b3a55,#4a3b5c 60%,#6b4e4a)}
</style></head><body>
<p>Versão limpa: as duas folhas se diferenciam só pelo tom; a integral é o vão entre elas. Colunas: os três estilos que você aceitou. A última coluna é o objeto na dock. Tudo no azul; o acento troca a cor da placa como antes.</p>
<div id="out"></div>
<script>
let K=0;
const mix=(c,p,w)=>`color-mix(in oklch,${c} ${p}%,${w})`;
const PLATE=`<rect x="100" y="100" width="824" height="824" rx="185"`;
// cada forma: partes brancas (main) e detalhe na cor (det, recebe a cor do acento)
const IP="M676 268C640 226 572 228 548 300C534 344 530 420 524 512C518 604 512 682 498 724C474 796 406 798 364 756";
const INT=(c,w)=>`<path d="${IP}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><circle cx="680" cy="300" r="${w*0.8}" fill="${c}"/><circle cx="360" cy="724" r="${w*0.8}" fill="${c}"/>`;
// regiões à esquerda e à direita da integral (a linha central dela vira a divisa entre as folhas)
const LEFT="M0 0H566L548 300C534 344 530 420 524 512C518 604 512 682 498 724L486 1024H0Z";
const RIGHT="M566 0H1024V1024H486L498 724C512 682 518 604 524 512C530 420 534 344 548 300Z";
const SHEET=`<rect x="214" y="262" width="596" height="500" rx="34"/>`;
// o vão da integral entre duas folhas; cada folha tem os próprios cantos
const CUT=(id,w=46)=>`<mask id="${id('m')}"><rect width="1024" height="1024" fill="#fff"/>${INT('#000',w)}</mask>`;
const two=(id,fill,{lt='',rt='',lfill=fill,rfill=fill,lin='',rin='',lrect=[226,262,580,500],rrect=[218,262,580,500],lsh=''})=>`${CUT(id)}<clipPath id="${id('L')}"><path d="${LEFT}"/></clipPath><clipPath id="${id('R')}"><path d="${RIGHT}"/></clipPath>
 <g mask="url(#${id('m')})"><g clip-path="url(#${id('L')})"><g transform="${lt}"${lsh}><rect x="${lrect[0]}" y="${lrect[1]}" width="${lrect[2]}" height="${lrect[3]}" rx="34" fill="${lfill}"/>${lin}</g></g>
 <g clip-path="url(#${id('R')})"><g transform="${rt}"><rect x="${rrect[0]}" y="${rrect[1]}" width="${rrect[2]}" height="${rrect[3]}" rx="34" fill="${rfill}"/>${rin}</g></g></g>`;
// pauta (enunciado) e quadriculado (formulário/rascunho)
const RULE=c=>`<g stroke="${c}" stroke-width="12" stroke-linecap="round"><path d="M276 350H470M276 420H480M276 490H460M276 560H476M276 630H440"/></g>`;
const GRID=c=>`<g stroke="${c}" stroke-width="7"><path d="M560 300V740M620 300V740M680 300V740M740 300V740M540 340H790M540 400H790M540 460H790M540 520H790M540 580H790M540 640H790M540 700H790"/></g>`;
const ROT={lt:'rotate(-4 380 512) translate(-8 18)',rt:'rotate(3 640 512) translate(8 -14)'};
// esquerda: material impresso (linhas regulares, título mais grosso). direita: caderno à mão (papel creme, quadriculado e um traço de tinta na cor do acento)
const PRINT=`<g fill="#9aa3b2"><rect x="270" y="320" width="150" height="26" rx="6"/><rect x="270" y="392" width="200" height="14" rx="4"/><rect x="270" y="432" width="210" height="14" rx="4"/><rect x="270" y="472" width="190" height="14" rx="4"/><rect x="270" y="512" width="205" height="14" rx="4"/><rect x="270" y="592" width="200" height="14" rx="4"/><rect x="270" y="632" width="150" height="14" rx="4"/></g>`;
const GRIDC=`<g stroke="#d9cfb8" stroke-width="5"><path d="M560 230V800M612 230V800M664 230V800M716 230V800M768 230V800M520 330H800M520 382H800M520 434H800M520 486H800M520 538H800M520 590H800M520 642H800M520 694H800"/></g>`;
const INK=c=>`<path d="M566 380C590 350 620 352 626 378C632 404 600 420 612 446C626 474 668 440 690 418C708 400 728 412 724 438M572 540C600 520 640 528 668 548C690 562 716 556 740 536M572 610C608 596 650 612 700 600" fill="none" stroke="${c}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>`;
const F={
 k:{n:'K · Branca e creme',d:'Só o tom: uma folha branca (o material) e uma creme (o caderno). Nada dentro.',
  raw:(a,id,fill)=>two(id,fill,{...ROT,rfill:'#f3e6c8'})},
 l:{n:'L · Branca e creme, com um traço',d:'O mesmo, com um único traço de tinta na folha do caderno, na cor do acento.',
  raw:(a,id,fill)=>two(id,fill,{...ROT,rfill:'#f3e6c8',rin:`<path d="M576 560C606 520 640 520 660 548C680 576 712 572 740 536" fill="none" stroke="${a}" stroke-width="30" stroke-linecap="round"/>`})},
 m:{n:'M · Branca e tom do acento',d:'Uma folha branca e outra no tom claro do acento: muda junto quando você troca a cor.',
  raw:(a,id,fill)=>two(id,fill,{...ROT,rfill:mix(a,30,'#fff')})},
};
function icon(style,shape,acc,cls='ic'){
 const k='k'+(K++),id=n=>n+k,f=F[shape];
 const defs=`<filter id="${id('sh')}" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
 <filter id="${id('gs')}" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="${mix(acc,55,'#000')}" flood-opacity=".6"/></filter>
 <clipPath id="${id('pl')}">${PLATE}/></clipPath>
 <linearGradient id="${id('v')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(acc,72,'#fff')}"/><stop offset="1" stop-color="${mix(acc,85,'#000')}"/></linearGradient>
 <linearGradient id="${id('vd')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(acc,90,'#fff')}"/><stop offset="1" stop-color="${mix(acc,62,'#000')}"/></linearGradient>
 <linearGradient id="${id('w')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dde2ea"/></linearGradient>
 <linearGradient id="${id('g')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".92"/><stop offset=".55" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity=".38"/></linearGradient>
 <radialGradient id="${id('glow')}" cx=".28" cy=".12" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <filter id="${id('bl')}"><feGaussianBlur stdDeviation="40"/></filter>`;
 const plate=fill=>`<g filter="url(#${id('sh')})">${PLATE} fill="${fill}"/></g>`;
 let b;
 const R=(fill)=>f.raw(acc,id,fill);
 if(style==='chapado')b=`${plate(acc)}${R('#fff')}`;
 if(style==='objeto')b=`${plate(`url(#${id('v')})`)}${PLATE} fill="url(#${id('glow')})"/><rect x="104" y="104" width="816" height="816" rx="181" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="6"/><g filter="url(#${id('gs')})">${R(`url(#${id('w')})`)}</g>`;
 // vidro mais firme: placa mais escura, peça mais opaca e contorno branco cheio, para não sumir
 if(style==='vidro')b=`${plate(`url(#${id('vd')})`)}<g clip-path="url(#${id('pl')})" filter="url(#${id('bl')})"><circle cx="290" cy="240" r="250" fill="${mix(acc,45,'#fff')}" opacity=".75"/><circle cx="820" cy="900" r="280" fill="${mix(acc,55,'#000')}" opacity=".8"/></g>${PLATE} fill="url(#${id('glow')})"/><g filter="url(#${id('gs')})">${R(`url(#${id('g')})`)}</g>`;
 return `<svg class="${cls}" viewBox="0 0 1024 1024"><defs>${defs}</defs>${b}</svg>`;
}
const nb=(bg,inner)=>`<svg viewBox="0 0 1024 1024"><rect x="100" y="100" width="824" height="824" rx="185" fill="${bg}"/>${inner}</svg>`;
const N=[nb('#f5f5f2','<circle cx="512" cy="512" r="230" fill="#e2483d"/>'),nb('#1f8a5b','<rect x="300" y="300" width="424" height="424" rx="60" fill="#fff"/>'),nb('#262626','<path d="M330 690L512 330L694 690Z" fill="#f2b632"/>')];
const A='#2d5fdc';
let h='<table><tr><th class="l"></th><th>Chapado</th><th>Objeto</th><th>Vidro</th><th>Dock (objeto)</th><th>32 · 16</th></tr>';
for(const s of Object.keys(F))h+=`<tr><td class="l"><b>${F[s].n}</b>${F[s].d}</td>${['chapado','objeto','vidro'].map(st=>`<td>${icon(st,s,A)}</td>`).join('')}<td><div class="desk"><div class="dock">${N[0]}${N[1]}${icon('objeto',s,A,'')}${N[2]}</div></div></td><td>${icon('objeto',s,A,'s32')} ${icon('chapado',s,A,'s16')}</td></tr>`;
document.getElementById('out').innerHTML=h+'</table>';
</script></body></html>
