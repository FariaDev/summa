<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Logo — na dock do Lucas</title>
<style>
body{margin:0;font:14px/1.45 system-ui,sans-serif;color:#d8d8d8}
p{margin:6px 0 10px;color:#a8a8a8;font-size:13px;max-width:700px}
h2{font-size:14px;color:#eee;margin:16px 0 6px}
.wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.dock{display:flex;flex-direction:column;gap:6px;padding:8px 6px;border-radius:18px;background:#4a4a4c;border:1px solid #ffffff22}
.dock svg{width:52px;height:52px;display:block}
.big{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.big figure{margin:0;text-align:center;font:11px system-ui;color:#999}
.big svg{width:120px;height:120px;display:block}
.sm svg{width:32px;height:32px}.xs svg{width:16px;height:16px}
.col{display:flex;flex-direction:column;gap:6px}
</style></head><body>
<p>A dock imita a sua (modo escuro dos ícones). Os vizinhos são símbolos genéricos, não as marcas de verdade. Cada coluna é um desenho da integral.</p>
<div id="out"></div>
<script>
let K=0;
const mix=(c,p,w)=>`color-mix(in oklch,${c} ${p}%,${w})`;
// três desenhos da ∫
const G={
 cal:{n:'Caligráfica',svg:`<path d="M558 286C546 370 532 450 500 560C484 640 462 715 440 760L488 772C514 716 548 640 576 556C602 450 604 368 600 294Z"/>
   <path d="M579 304C584 252 618 222 652 224C678 226 694 244 696 268" fill="none" stroke="currentColor" stroke-width="48" stroke-linecap="round"/><circle cx="694" cy="280" r="36"/>
   <path d="M464 762C452 808 420 832 386 826C362 822 346 802 344 780" fill="none" stroke="currentColor" stroke-width="48" stroke-linecap="round"/><circle cx="346" cy="770" r="36"/>`},
 mono:{n:'Traço único',svg:`<path d="M676 268C640 226 572 228 548 300C534 344 530 420 524 512C518 604 512 682 498 724C474 796 406 798 364 756" fill="none" stroke="currentColor" stroke-width="88" stroke-linecap="round"/>`},
 gota:{n:'Gotas grandes',svg:`<path d="M676 268C640 226 572 228 548 300C534 344 530 420 524 512C518 604 512 682 498 724C474 796 406 798 364 756" fill="none" stroke="currentColor" stroke-width="64" stroke-linecap="round"/><circle cx="682" cy="300" r="64"/><circle cx="358" cy="724" r="64"/>`},
};
// modos: escuro (placa preta, símbolo branco), colorido (placa no acento), tingido (tudo num tom do acento)
function icon(g,mode,acc='#2d5fdc'){
 const k='k'+(K++);
 const plate={escuro:['#2c2c2e','#141414'],colorido:[mix(acc,75,'#fff'),mix(acc,82,'#000')],tingido:[mix(acc,22,'#1a1a1a'),mix(acc,12,'#0d0d0d')]}[mode];
 const glyph={escuro:['#ffffff','#cfcfcf'],colorido:['#ffffff','#e3e6ee'],tingido:[mix(acc,55,'#fff'),mix(acc,70,'#fff')]}[mode];
 return `<svg viewBox="0 0 1024 1024"><defs><linearGradient id="p${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${plate[0]}"/><stop offset="1" stop-color="${plate[1]}"/></linearGradient>
  <linearGradient id="g${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${glyph[0]}"/><stop offset="1" stop-color="${glyph[1]}"/></linearGradient>
  <filter id="s${k}" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter></defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#p${k})"/><rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="6"/>
  <g transform="translate(512 512) scale(1.12) translate(-520 -512)"><g filter="url(#s${k})" fill="url(#g${k})" color="${glyph[0]}" style="color:${glyph[0]}">${G[g].svg.replaceAll('currentColor',`url(#g${k})`)}</g></g></svg>`;
}
const nb=inner=>`<svg viewBox="0 0 1024 1024"><rect x="100" y="100" width="824" height="824" rx="185" fill="#1c1c1e"/><g fill="#fff" stroke="#fff">${inner}</g></svg>`;
const N=[nb('<path d="M420 300V640A80 70 0 1 1 380 580V340L640 290V590A80 70 0 1 1 600 530V300" stroke-width="0"/><rect x="420" y="290" width="220" height="60" stroke-width="0"/>'),
 nb('<rect x="270" y="350" width="484" height="330" rx="40" fill="none" stroke-width="44"/><path d="M290 380L512 540L734 380" fill="none" stroke-width="44"/>'),
 nb('<ellipse cx="512" cy="500" rx="260" ry="200" stroke-width="0"/><path d="M360 640L330 760L470 680Z" stroke-width="0"/>'),
 nb('<circle cx="512" cy="512" r="200" fill="none" stroke-width="70"/><circle cx="512" cy="512" r="60" stroke-width="0"/>')];
let h='<div class="wrap">';
for(const g of Object.keys(G)){
 h+=`<div class="col"><h2>${G[g].n}</h2><div class="dock">${N[0]}${N[1]}${icon(g,'escuro')}${N[2]}${N[3]}</div></div>`;
}
h+='</div>';
for(const g of Object.keys(G)){
 h+=`<h2>${G[g].n}: os três modos do macOS e tamanhos</h2><div class="big"><figure>${icon(g,'escuro')}escuro</figure><figure>${icon(g,'colorido')}colorido (azul)</figure><figure>${icon(g,'colorido','#af4700')}colorido (laranja)</figure><figure>${icon(g,'tingido','#028053')}tingido</figure><figure class="sm">${icon(g,'escuro')}32</figure><figure class="xs">${icon(g,'escuro')}16</figure></div>`;
}
document.getElementById('out').innerHTML=h;
</script></body></html>
